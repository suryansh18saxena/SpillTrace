name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: spilltrace
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: spilltrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spilltrace" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      SPILLTRACE_ENV: test
      SPILLTRACE_SECRET_KEY: ci-secret-key-not-used-in-any-deployment
      POSTGRES_USER: spilltrace
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: spilltrace
      POSTGRES_HOST: localhost
      S3_SECRET_KEY: ci-only-password
      SPILLTRACE_STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Lint
        run: |
          ruff check backend/src backend/tests
          ruff format --check backend/src backend/tests
      - name: Type check
        working-directory: backend
        run: mypy src
      - name: Unit tests
        working-directory: backend
        run: python -m pytest -q tests/unit
      - name: GIS tests
        working-directory: backend
        run: python -m pytest -q tests/gis -m "not requires_credentials"

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test -- --run
      - run: npm run build

  security:
    name: Secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials reachable from the browser
        run: bash infra/scripts/audit_secrets.sh

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.backend --target runtime --build-arg INSTALL_DEV=false -t spilltrace-api:ci .
      - run: docker build -f infra/Dockerfile.frontend --target runtime -t spilltrace-frontend:ci .
